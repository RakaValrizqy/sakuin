name: sakuin
description: "Aplikasi pencatat keuangan offline-first yang cepat dan ringan."
publish_to: 'none'

version: 1.7.0+12

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.32
  intl: ^0.20.2
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  share_plus: ^11.0.0
  pdf: ^3.11.3

dependency_overrides:
  # image 4.11.0 memanggil ZLibDecoder.decodeLazy yang belum ada di archive 4.0.9 (dipin oleh pdf 3.12.0).
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
