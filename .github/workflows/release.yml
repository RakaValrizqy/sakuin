name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name opsional (mis. 1.0.1). Kosongkan untuk memakai pubspec.yaml."
        required: false
        type: string
      create_github_release:
        description: "Buat GitHub Release (untuk workflow_dispatch)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Validasi Signing Secrets (Wajib untuk update tanpa uninstall)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secret signing berikut belum diatur di GitHub Repository Secrets: ${missing[*]}"
            echo "Release build dibatalkan karena tidak boleh memakai debug keystore."
            echo "Keystore yang konsisten WAJIB dipakai agar APK bisa diupdate tanpa uninstall."
            echo "Lihat README.md bagian 'Setup Keystore & Secrets' untuk panduan lengkap."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify analyze & test before release
        run: |
          flutter analyze
          flutter test

      - name: Hitung Version Name & Monotonic Version Code
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PUBSPEC_LINE=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          PUBSPEC_NAME="${PUBSPEC_LINE%%+*}"
          PUBSPEC_BUILD="${PUBSPEC_LINE##*+}"
          if [ "$PUBSPEC_BUILD" = "$PUBSPEC_LINE" ] || [ -z "$PUBSPEC_BUILD" ]; then
            PUBSPEC_BUILD=1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="${INPUT_VERSION_NAME#v}"
            TAG_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME="${PUBSPEC_NAME}"
            TAG_NAME="v${VERSION_NAME}-build.${RUN_NUMBER}"
          fi

          # Version code selalu naik secara monoton agar Android selalu mengizinkan update tanpa uninstall.
          # Mengambil nilai terbesar antara build number di pubspec.yaml dan github.run_number.
          if [ "$RUN_NUMBER" -gt "$PUBSPEC_BUILD" ]; then
            VERSION_CODE="$RUN_NUMBER"
          else
            VERSION_CODE="$PUBSPEC_BUILD"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION_NAME} (versionCode=${VERSION_CODE}, tag=${TAG_NAME})"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release APKs (split per ABI + obfuscated)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Laporan ukuran APK
        run: |
          echo "### Ukuran APK Release Sakuin v${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Ukuran |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            name=$(basename "$apk")
            size_mb=$(awk "BEGIN {printf \"%.2f MB\", $(stat -c%s "$apk")/1048576}")
            echo "| \`$name\` | $size_mb |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: $size_mb"
          done

      - name: Rename APKs with version for clarity
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/app-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/app-x86_64-release.apk

      - name: Cleanup keystore files
        if: always()
        run: |
          rm -f android/app/release-keystore.jks android/key.properties

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sakuin-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}-apks
          path: release-assets/*.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: sakuin-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}-symbols
          path: build/symbols/**
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Sakuin v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          body: |
            ## Sakuin v${{ steps.version.outputs.version_name }} (Build `${{ steps.version.outputs.version_code }}`)

            ### Cara Install / Update Tanpa Uninstall
            1. Untuk HP Android modern (termasuk Redmi Note 11 Pro 5G), unduh **`app-arm64-v8a-release.apk`**.
            2. Buka file APK dan ketuk **Update / Perbarui** — data transaksi, dompet, hutang, dan pengaturan akan tetap aman tanpa perlu uninstall aplikasi lama.
            3. Pastikan selalu memasang varian ABI yang sama (`arm64-v8a`) pada setiap update.
          files: |
            release-assets/app-arm64-v8a-release.apk
            release-assets/app-armeabi-v7a-release.apk
            release-assets/app-x86_64-release.apk
